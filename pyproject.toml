[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onto_metrics"
version = "0.1.0"
description = "Modular ontology metrics and quality scoring for RDF/OWL ontologies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "onto_metrics contributors" }]
dependencies = [
    "rdflib>=6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jsonschema>=4.0"]

[project.scripts]
onto-metrics = "onto_metrics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["onto_metrics*"]

[tool.setuptools.package-data]
onto_metrics = ["report/schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
